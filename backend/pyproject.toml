[project]
name = "rag-system"
version = "0.1.0"
description = "Question answering over company PDFs: Flask API, Bedrock, Textract and Pinecone."
authors = [
    { name = "Mayur Suhasiya", email = "mayursuhasiya136@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.127",
    "flask>=3.1.3",
    "pillow>=13.0.0",
    "pinecone>=10.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.15.2",
]

[project.scripts]
rag = "rag_system.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,textract]>=1.43.127",
    "fpdf2>=2.9.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
